<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device</title>
<style>
:root { --page: #eceae4; --glow: #f8f7f3; --ink: #1d1d1f; --muted: #6e6e73; --bar: rgba(255, 255, 255, 0.86); --edge: rgba(0, 0, 0, 0.1); }
@media (prefers-color-scheme: dark) {
  :root { --page: #141416; --glow: #24242a; --ink: #f2f2f7; --muted: #a1a1a6; --bar: rgba(44, 44, 46, 0.86); --edge: rgba(255, 255, 255, 0.12); }
}
html, body { margin: 0; height: 100%; color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
body { background: radial-gradient(ellipse at 50% 42%, var(--glow) 0%, var(--page) 70%); }
#scene { position: fixed; inset: 0; }
#scene > div:first-child { position: absolute; inset: 0; }
#scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#shield { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#shield:active { cursor: grabbing; }
#hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border: 1px solid var(--edge); border-radius: 999px; background: var(--bar); color: var(--muted); backdrop-filter: blur(12px); white-space: nowrap; pointer-events: none; z-index: 2; transition: opacity 0.2s; }
body.live #hint { color: var(--ink); }
.screen { overflow: hidden; background: #000; }
.screen iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
#bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--edge); border-radius: 10px; background: var(--bar); backdrop-filter: blur(12px); z-index: 2; }
#bar button { border: 1px solid var(--edge); border-radius: 7px; background: transparent; color: var(--ink); font: inherit; padding: 4px 10px; cursor: pointer; }
#credit { color: var(--muted); font-size: 11px; white-space: nowrap; text-decoration: none; }
#credit:hover { text-decoration: underline; }
#facts { margin-left: auto; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#notice { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); overflow-wrap: anywhere; z-index: 3; }
body.failed #notice { display: grid; }
body.failed #bar { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hint"></div>
<div id="bar">
  <button id="front" type="button" title="Face the screen (F)">Front</button>
  <button id="fit" type="button">Fit</button>
  <button id="spin" type="button">Spin</button>
  <button id="fold" type="button" hidden title="Fold or unfold the device (D)">Fold</button>
  <button id="farther" type="button" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="closer" type="button" title="Zoom in" aria-label="Zoom in">+</button>
  <a id="credit" hidden target="_blank" rel="noopener"></a>
  <span id="facts"></span>
</div>
<div id="notice"></div>
<script type="module" src="./device.js"></script>
</body>
</html>
