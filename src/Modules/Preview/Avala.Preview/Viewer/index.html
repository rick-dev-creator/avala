<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model</title>
<style>
:root { --page: #f4f3ef; --ink: #1d1d1f; --muted: #6e6e73; --bar: rgba(255, 255, 255, 0.86); --edge: rgba(0, 0, 0, 0.1); --on: #3a5bd9; }
@media (prefers-color-scheme: dark) {
  :root { --page: #1c1c1e; --ink: #f2f2f7; --muted: #a1a1a6; --bar: rgba(44, 44, 46, 0.86); --edge: rgba(255, 255, 255, 0.12); --on: #8ea2ff; }
}
html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--edge); border-radius: 10px; background: var(--bar); backdrop-filter: blur(12px); }
#bar button { border: 1px solid var(--edge); border-radius: 7px; background: transparent; color: var(--ink); font: inherit; padding: 4px 10px; cursor: pointer; }
#bar button[aria-pressed="true"] { color: var(--on); border-color: var(--on); }
#facts { margin-left: auto; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#notice { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); overflow-wrap: anywhere; }
body.failed #notice { display: grid; }
body.failed #bar { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="fit" type="button">Fit</button>
  <button id="wireframe" type="button" aria-pressed="false">Wireframe</button>
  <button id="grid" type="button" aria-pressed="true">Grid</button>
  <span id="facts">Loading…</span>
</div>
<div id="notice"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
